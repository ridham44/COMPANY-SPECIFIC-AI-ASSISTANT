# this doesn't pull any model on its own - see SETUP.md for that step
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:7b-instruct-q4_K_M
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
